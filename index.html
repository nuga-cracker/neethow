(function(){

      question:`닛컴으로 연결될 수 있는 것에 항상 감사하지만, 최근에 교류와 동료애란 것에 대해 현타...도 크게 느끼고 있는데 어떻게 극복하면 좋을까요? 결국은 각자가 해결할 것들을 안고 모인 사람들뿐이고... 내 일은 결국 나 혼자의 일이라는 생각이 자꾸 강하게 들어서 몹시 지칩니다.`,
      answers:[
        { type:"answer", gist:"지치는 지점 살피고 도움 요청하기", text:`아무래도 단기성이라서 아쉬운 점이 있기도 하죠ㅠ 저도 관계란 시간이 흘러가면서 두터워지는 거라고 생각하거든요. 각자 가진 고민들을 다 알 순 없지만 모두가 같은 마음으로 모인 자리에서 서로가 교류하는 것에도 의미가 있다고 생각합니다. 말씀하시듯 내 일은 내가 결정해야 되기도 하지만, 그 과정 속에서 해답을 찾는 방법은 다양하다고 생각해요.

    document.title = story.title + " · Neethow";
    var h = article.querySelector("h1");
    if (h){ h.setAttribute("tabindex", "-1"); try { h.focus({ preventScroll:true }); } catch(e){} }
  }

  var curHash = location.hash || "";
  function go(h){
    curHash = h;
    try {
      if (h !== location.hash) history.pushState(null, "", h);
    } catch(e){}
    route();
  }

  function parseHash(){
    var h = curHash.replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean);
    if (parts[0] === "story" && parts[1]) return { view:"detail", id: parts[1].split("#")[0] };
    if (parts[0] === "guide") return { view:"guide", page: parts[1] ? parseInt(parts[1],10) : 0 };
    if (parts[0] === "cat" && parts[1]) return { view:"list", cat: decodeURIComponent(parts[1]) };
    return { view:"list", cat:"all" };
  }

  function route(){
    var r = parseHash();
    viewGuide.hidden = true;
    if (r.view === "guide"){
      viewList.hidden = true;
      viewDetail.hidden = true;
      viewGuide.hidden = false;
      renderGuide();
      document.title = "어깨를 빌리고 싶어질 때면… · Neethow";
      if (r.page > 1) setTimeout(function(){ guideJump(r.page); }, 60); else window.scrollTo(0,0);
      return;
    }
    if (r.view === "detail"){
      viewList.hidden = true;
      viewDetail.hidden = false;
      renderDetail(r.id);
      window.scrollTo(0,0);
    } else {
      viewDetail.hidden = true;
      viewList.hidden = false;
      document.title = "Neethow · 우리가 함께 나누었던 고민들";
      renderList(r.cat, searchInput.value);
    }
  }

  categoryNav.addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if (!btn) return;
    var cat = btn.getAttribute("data-cat");
    go(cat === "all" ? "#/" : "#/cat/" + encodeURIComponent(cat));
  });

  searchForm.addEventListener("submit", function(e){ e.preventDefault(); });
  searchInput.addEventListener("input", function(){
    if (curHash.indexOf("#/story") === 0){
      curHash = "#/";
      try { history.replaceState(null, "", "#/"); } catch(e){}
    }
    viewDetail.hidden = true;
    viewGuide.hidden = true;
    viewList.hidden = false;
    var r = parseHash();
    var cat = r.view === "list" ? r.cat : "all";
    renderList(cat, searchInput.value);
  });

  document.getElementById("navBrowse").addEventListener("click", function(){
    go("#/");
    document.getElementById("catRibbon").scrollIntoView({ behavior:"smooth", block:"start" });
  });
  document.getElementById("navGuide").addEventListener("click", function(){ go("#/guide"); });
  view_guide_clicks();
  function view_guide_clicks(){
    viewGuide.addEventListener("click", function(e){
      var b = e.target.closest && e.target.closest("button[data-gp]");
      if (b) guideJump(b.getAttribute("data-gp"));
    });
  }
  document.getElementById("navRandom").addEventListener("click", function(){
    var pick = STORIES[Math.floor(Math.random() * STORIES.length)];
    go("#/story/" + pick.id);
  });

  document.getElementById("detailArticle").addEventListener("click", function(e){
    var a = e.target.closest(".toc-list a");
    if (!a) return;
    e.preventDefault();
    var target = document.getElementById(a.getAttribute("href").slice(1));
    if (target) target.scrollIntoView({ behavior:"smooth", block:"start" });
  });

  document.addEventListener("click", function(e){
    var a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    e.preventDefault();
    go(a.getAttribute("href"));
  });

  function syncFromLocation(){
    if (location.hash === curHash) return;
    curHash = location.hash;
    route();
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }

  window.addEventListener("hashchange", syncFromLocation);
  window.addEventListener("popstate", syncFromLocation);
  route();
})();
</script>

</body>
</html>
